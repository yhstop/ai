<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Header</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #fff;
      }

      header {
        width: 100%;
        height: 80px;
        background: #ffffff;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 60px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 26px;
        font-weight: bold;
        color: #000;
      }

      .logo span {
        color: #f26a3d;
        font-size: 28px;
      }

      nav {
        display: flex;
        gap: 40px;
      }

      nav a {
        text-decoration: none;
        color: #333;
        font-size: 14px;
        position: relative;
        height: 80px;
        display: flex;
        align-items: center;
      }

      nav a.active {
        color: #333;
        font-weight: normal;
      }

      nav a:hover {
        color: #f26a3d;
      }

      nav a:hover::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: #f26a3d;
      }

      .actions {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .btn {
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        border: none;
      }

      .btn-dark {
        background: #333;
        color: #fff;
      }

      .btn-orange {
        background: #f26a3d;
        color: #fff;
      }

      /* Desktop fixed width 느낌 유지 (반응형 금지) */
      .container {
        width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo"><span>✱</span> Claude</div>

        <nav>
          <a href="#" class="active">ABOUT</a>
          <a href="#">PRODUCTS</a>
          <a href="#">PARTERSHIP</a>
          <a href="#">EDUCATION</a>
          <a href="#">WHAT'S NEW</a>
          <a href="#">SUPPORT</a>
        </nav>

        <div class="actions">
          <button class="btn btn-dark">매장찾기</button>
          <button class="btn btn-orange">글로벌마켓</button>
        </div>
      </div>
    </header>
  </body>
</html>
