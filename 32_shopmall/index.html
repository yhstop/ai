<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>집반찬연구소</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <!-- 검색 -->
      <div class="search"></div>
      <!-- 로고 -->
      <div class="logo"></div>
      <!-- 오른쪽박스 -->
      <div class="right"></div>
    </header>
    <section id="slider"></section>
    <main>
      <!-- 반찬 영역 -->
      <div class="banchan">
        <div class="tit">
          <h2>부담없는 알뜰 반찬</h2>
          <p>착한 가격으로 챙기는 든든 한 끼</p>
        </div>
        <!-- 제품 리스트 -->
        <div class="product">
          <div class="card">
            <div class="imgbox">
              <img
                src="./images/04_md_banchan/imgi_232_ZIP_P_0214_A.png"
                alt="반찬1"
              />
            </div>
            <div class="info">
              <span class="new">신제품</span>
              <h3>쭈꾸미 풋마늘 파스타</h3>
              <p>봄기운 가득!쭈꾸미의 풋마늘의 찰떡 궁합</p>
              <h4><span class="sale">7%</span> 12,800원</h4>
              <span class="price">13,800원</span>
            </div>
          </div>
          <div class="card">
            <div class="imgbox">
              <img
                src="./images/04_md_banchan/imgi_233_ZIP_P_0213_A.png"
                alt="반찬1"
              />
            </div>
            <div class="info">
              <span class="new">신제품</span>
              <h3>쭈꾸미 미나리 파스타</h3>
              <p>지금이 제철!쭈꾸미와 미나리와 만남</p>
              <h4><span class="sale">7%</span> 12,800원</h4>
              <span class="price">13,800원</span>
            </div>
          </div>
          <div class="card">3</div>
          <div class="card">4</div>
          <div class="card">5</div>
          <div class="card">6</div>
          <div class="card">7</div>
          <div class="card">8</div>
        </div>
      </div>
      <!-- 정기적 반찬 -->
      <div class="day-banchan"></div>
      <!-- 신제품반찬 -->
      <div class="new-banchan"></div>
      <!-- 배너 영역 -->
      <div class="banner"></div>
      <!-- md 추천반찬 -->
      <div class="md-banchan"></div>
    </main>
    <footer>
      <div class="footer-left"></div>
      <div class="footer-right"></div>
    </footer>
  </body>
</html>
